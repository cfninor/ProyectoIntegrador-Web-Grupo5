name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  pruebas:
    name: Pruebas unitarias y de componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Jest con cobertura
        run: npm run test:ci
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-web
          path: coverage/

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/solventa-web/browser/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7

  # Análisis de calidad y cobertura. No forma parte de ci-gate: informa, no bloquea el merge.
  sonarqube:
    name: SonarQube Cloud
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Sin token, se omite el análisis
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::No hay SONAR_TOKEN disponible (por ejemplo, en un PR de Dependabot). Se omite el análisis."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0  # la historia completa permite detectar el código nuevo
      - name: Descargar el reporte de cobertura de Jest
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: cobertura-web
          path: coverage
      - name: Análisis en SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  # Único check obligatorio en la regla de protección de main.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [calidad, pruebas, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Al menos un job falló o se canceló."
            exit 1
          fi
          echo "Todos los jobs pasaron."
