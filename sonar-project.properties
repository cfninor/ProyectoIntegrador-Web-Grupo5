# Análisis en SonarQube Cloud (organización proyecto-grupo5, plan Free).
sonar.organization=proyecto-grupo5
sonar.projectKey=cfninor_ProyectoIntegrador-Web-Grupo5
sonar.projectName=ProyectoIntegrador-Web-Grupo5

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts,e2e/**
sonar.exclusions=**/*.spec.ts

# Cobertura de Jest (coverageReporters incluye lcov). Igual que en jest.config.js, solo cuenta src/app.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/setup-jest.ts
