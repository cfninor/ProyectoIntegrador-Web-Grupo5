openapi: 3.1.0
info:
  title: Solventa · BFF Web
  version: 1.1.0
  description: >
    Contrato de la API que consume el portal web (repo ProyectoIntegrador-Web-Grupo5).
    Se diseña antes que el código (contrato primero) y se versiona por URI (/v1).
    Dentro de /v1 solo se admiten cambios compatibles; un cambio incompatible va en /v2 (BA-04).

    Autenticación (SOLVENTAG5-207, ADR 0008): toda operación exige el ID token de Cognito del
    portal en `Authorization: Bearer`, salvo las que declaran `security: []`. Sin un token
    válido el BFF responde 401 NO_AUTENTICADO; si el rol del token no puede llamar la
    operación, 403 SIN_PERMISO. La extensión `x-roles` lista los roles (grupos de Cognito) que
    pueden llamar cada operación protegida, y `x-cuenta-sin-rol: true` marca la única operación
    que atiende la cuenta de un cliente que todavía no termina su registro.
servers:
  - url: http://localhost:8010
    description: Local (docker compose)
security:
  - tokenCognito: []
tags:
  - name: autorizacion-datos
    description: >
      Operaciones del cliente sobre la autorización de consulta de datos de Open Data y
      Open Finance para el perfilamiento (SOLVENTAG5-65). Ver y decidir la solicitud son
      públicas: el cliente entra sin iniciar sesión, con el id aleatorio de la solicitud que
      recibe en el enlace del correo. Revocar un consentimiento exige la sesión del cliente.
  - name: asesor
    description: >
      Operaciones que inicia el asesor. El asesor sale del token: el BFF no confía en datos del
      asesor que lleguen en la petición. El cliente también consulta el estado de su propia
      autorización.
  - name: cotizacion
    description: >
      Cotización en línea según el perfil de riesgo del cliente (SOLVENTAG5-47). Si el perfil
      no está disponible a tiempo, el journey no se bloquea: la prima se calcula con el valor por
      defecto de BA-01 y la cotización queda marcada con calculadaSinPerfil. Con la sesión del
      asesor, el id del cliente viaja en la petición; con la del cliente, el BFF usa el id del
      cliente de su token.
  - name: cuenta
    description: >
      Cuenta del cliente en el portal (SOLVENTAG5-207). El cliente crea su cuenta de Cognito
      desde el portal y aquí la enlaza con su registro del núcleo. El personal y los socios no se
      registran: los crea el administrador.
  - name: trazabilidad
    description: >
      Reconstrucción de las decisiones automáticas para actuaría y cumplimiento
      (SOLVENTAG5-128, ADR 0006). Solo para el analista de riesgo y operaciones.
  - name: suscripcion
    description: >
      Solicitudes de suscripción (SOLVENTAG5-133). Cuando el cliente acepta la oferta, se crea
      una solicitud que conserva la cotización, la prima, la cobertura y el perfil con que se
      calculó, y queda pendiente de la evaluación automática (SOLVENTAG5-50). El responsable de
      suscripción consulta ese mismo perfil para evaluarla (SOLVENTAG5-67).
paths:
  /v1/clientes/{clienteId}/solicitudes-autorizacion:
    post:
      tags: [asesor]
      operationId: pedirAutorizacion
      summary: Pedir al cliente la autorización de consulta de datos
      description: >
        Si el cliente ya tiene una solicitud PENDIENTE, se reenvía esa misma (200, reenviada
        true); si no, se crea una nueva (201). El correo se simula: el núcleo escribe el
        enlace en su log. El asesor que pide la autorización es el del token (su id y su
        nombre): el BFF ignora el campo asesor del cuerpo, que queda obsoleto.
      x-roles: [ASESOR]
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedirAutorizacion'
            examples:
              sinAsesor:
                summary: Sin el campo obsoleto
                value: {}
              conAsesorObsoleto:
                summary: Con el campo obsoleto, que el BFF ignora
                value:
                  asesor:
                    id: asesor-017
                    nombre: Laura Gómez
      responses:
        '201':
          description: Solicitud nueva creada y enviada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudEnviada'
              example:
                solicitudId: 3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
                estado: PENDIENTE
                fechaSolicitud: '2026-10-09T14:30:00Z'
                envios: 1
                reenviada: false
                enlace: http://localhost:4200/autorizar/3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
        '200':
          description: Ya había una solicitud pendiente y se reenvió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudEnviada'
              example:
                solicitudId: 3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
                estado: PENDIENTE
                fechaSolicitud: '2026-10-09T14:30:00Z'
                envios: 2
                reenviada: true
                enlace: http://localhost:4200/autorizar/3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ClienteYaAutorizado'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/clientes/{clienteId}/autorizacion-datos:
    get:
      tags: [asesor]
      operationId: consultarEstadoAutorizacionCliente
      summary: Consultar el estado de la autorización de datos de un cliente
      description: >
        El cliente solo consulta la suya: con su sesión, un clienteId distinto del de su token
        responde 403 SIN_PERMISO.
      x-roles: [ASESOR, CLIENTE]
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Estado de la autorización del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoAutorizacionCliente'
              example:
                clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
                estado: AUTORIZADA
                fechaEstado: '2026-10-09T15:02:11Z'
                solicitudId: 3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
                consentimientoId: 7c6e5d4b-3a2f-4e1d-9c8b-0a1f2e3d4c5b
                fechaVencimiento: '2027-10-09T15:02:11Z'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/clientes/{clienteId}/consentimientos:
    get:
      tags: [autorizacion-datos]
      operationId: consultarConsentimientosCliente
      summary: Consultar los consentimientos que el cliente ha otorgado
      description: >
        Todos los consentimientos del cliente con su estado ahora (SOLVENTAG5-84): VIGENTE,
        REVOCADO o VENCIDO, con los datos que cubre cada uno, a quién autoriza, para qué y sus
        fechas. Primero los vigentes y, en cada grupo, del más reciente al más antiguo. Se lee de
        la base en cada consulta, así que una revocación se ve en la siguiente consulta. Si el
        cliente no tiene ninguno, la lista va vacía (no es un error). El cliente solo consulta
        los suyos: con su sesión, un clienteId distinto del de su token responde 403
        SIN_PERMISO.
      x-roles: [CLIENTE]
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Consentimientos del cliente; lista vacía si no tiene ninguno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimientosCliente'
              examples:
                conConsentimientos:
                  $ref: '#/components/examples/ConsentimientosCliente'
                sinConsentimientos:
                  summary: El cliente no ha otorgado ninguno
                  value:
                    clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
                    consentimientos: []
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/clientes/busqueda:
    post:
      tags: [asesor]
      operationId: buscarCliente
      summary: Buscar un cliente por su documento de identidad
      description: >
        Búsqueda exacta por el tipo y el número de documento, contra el documento tokenizado
        (los nombres están cifrados y no se buscan). Si hay más de un cliente con el mismo
        documento, responde el registro más reciente. El documento va en el cuerpo y no en la
        URL para que no quede en los logs. El BFF valida solo la forma del cuerpo (tipos y
        campos obligatorios) y lo reenvía al núcleo; el patrón del número sirve para que la
        pantalla valide antes de buscar.
      x-roles: [ASESOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusquedaCliente'
            example:
              tipoDocumento: CC
              numeroDocumento: '1020305678'
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteEncontrado'
              example:
                clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
                nombres: María Fernanda
                apellidos: López Rojas
                documentoEnmascarado: CC ••••5678
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/ClienteNoEncontrado'
        '422':
          description: El cuerpo no cumple el contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                detail:
                  - loc: [body, tipoDocumento]
                    msg: "Input should be 'CC', 'CE', 'PA' or 'PPT'"
                    type: enum
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/solicitudes-autorizacion/{solicitudId}:
    get:
      tags: [autorizacion-datos]
      operationId: consultarSolicitudAutorizacion
      summary: Ver la solicitud de autorización (pantalla del cliente)
      description: >
        Devuelve quién pide la autorización, qué datos se consultan y de qué fuentes, y las
        condiciones, en la versión del catálogo con que se creó la solicitud. Solo trae
        códigos: la web pone los textos. No incluye el id del cliente ni el del asesor.
        Pública: el cliente llega por el enlace del correo (SOLV-WEB-20) sin iniciar sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Solicitud con su catálogo y condiciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudParaCliente'
              example:
                solicitudId: 3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
                estado: PENDIENTE
                asesor:
                  nombre: Laura Gómez
                fechaSolicitud: '2026-10-09T14:30:00Z'
                catalogo:
                  version: v1
                  fuentes:
                    - fuente: OPEN_FINANCE
                      datos:
                        - codigo: COMPORTAMIENTO_PAGO
                          entidades: [ENTIDADES_FINANZAS_ABIERTAS]
                        - codigo: ESTABILIDAD_INGRESOS
                          entidades: [ENTIDADES_FINANZAS_ABIERTAS]
                    - fuente: OPEN_DATA
                      datos:
                        - codigo: SOCIODEMOGRAFICA_TERRITORIAL
                          entidades: [DANE]
                        - codigo: SALUD_ACTUARIAL_AGREGADA
                          entidades: [MINSALUD]
                        - codigo: INMUEBLE_UBICACION
                          entidades: [IGAC]
                condiciones:
                  duracionMeses: 12
                  finalidad: PERFILAMIENTO_VIDA_HIPOTECARIO
                  destinatario: SOLVENTA
                  baseLegal: [LEY_1581_2012, DECRETO_1297_2022]
                  versionPolitica: v1
        '404':
          $ref: '#/components/responses/SolicitudNoEncontrada'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/solicitudes-autorizacion/{solicitudId}/decision:
    post:
      tags: [autorizacion-datos]
      operationId: decidirSolicitudAutorizacion
      summary: Autorizar o no autorizar la consulta de datos
      description: >
        Solo se decide una solicitud PENDIENTE. AUTORIZAR exige aceptaPolitica true y la
        versión vigente de la política, y crea un consentimiento VIGENTE por 12 meses.
        NO_AUTORIZAR no crea consentimiento ni exige la casilla. Pública: el cliente llega por
        el enlace del correo (SOLV-WEB-20) sin iniciar sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionSolicitud'
            examples:
              autorizar:
                summary: El cliente autoriza
                value:
                  decision: AUTORIZAR
                  aceptaPolitica: true
                  versionPolitica: v1
              noAutorizar:
                summary: El cliente no autoriza
                value:
                  decision: NO_AUTORIZAR
                  aceptaPolitica: false
                  versionPolitica: v1
      responses:
        '200':
          description: Decisión registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoDecision'
              examples:
                autorizada:
                  summary: Solicitud autorizada con su consentimiento
                  value:
                    solicitudId: 3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
                    estado: AUTORIZADA
                    consentimiento:
                      consentimientoId: 7c6e5d4b-3a2f-4e1d-9c8b-0a1f2e3d4c5b
                      estado: VIGENTE
                      alcance:
                        - COMPORTAMIENTO_PAGO
                        - ESTABILIDAD_INGRESOS
                        - SOCIODEMOGRAFICA_TERRITORIAL
                        - SALUD_ACTUARIAL_AGREGADA
                        - INMUEBLE_UBICACION
                      finalidad: PERFILAMIENTO_VIDA_HIPOTECARIO
                      destinatario: SOLVENTA
                      versionCatalogo: v1
                      versionPolitica: v1
                      fechaOtorga: '2026-10-09T15:02:11Z'
                      fechaVencimiento: '2027-10-09T15:02:11Z'
                noAutorizada:
                  summary: Solicitud no autorizada, sin consentimiento
                  value:
                    solicitudId: 3f8a2c1e-6b7d-4e9a-9c2f-1a2b3c4d5e6f
                    estado: NO_AUTORIZADA
        '404':
          $ref: '#/components/responses/SolicitudNoEncontrada'
        '409':
          $ref: '#/components/responses/SolicitudYaRespondida'
        '422':
          $ref: '#/components/responses/PoliticaNoAceptadaOValidacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/consentimientos/{consentimientoId}/revocacion:
    post:
      tags: [autorizacion-datos]
      operationId: revocarConsentimiento
      summary: Revocar un consentimiento vigente
      description: >
        Solo se revoca un consentimiento VIGENTE y no vencido. Después de confirmar la
        revocación se avisa a ms-perfilamiento para que deje de usar los datos en caché. El
        cliente solo revoca uno suyo: si el consentimiento no es del cliente de la sesión
        responde 404 CONSENTIMIENTO_NO_ENCONTRADO, como si no existiera, y no se revoca.
      x-roles: [CLIENTE]
      parameters:
        - $ref: '#/components/parameters/ConsentimientoId'
      responses:
        '200':
          description: Consentimiento revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentimiento'
              example:
                consentimientoId: 7c6e5d4b-3a2f-4e1d-9c8b-0a1f2e3d4c5b
                estado: REVOCADO
                alcance:
                  - COMPORTAMIENTO_PAGO
                  - ESTABILIDAD_INGRESOS
                  - SOCIODEMOGRAFICA_TERRITORIAL
                  - SALUD_ACTUARIAL_AGREGADA
                  - INMUEBLE_UBICACION
                finalidad: PERFILAMIENTO_VIDA_HIPOTECARIO
                destinatario: SOLVENTA
                versionCatalogo: v1
                versionPolitica: v1
                fechaOtorga: '2026-10-09T15:02:11Z'
                fechaVencimiento: '2027-10-09T15:02:11Z'
                fechaRevoca: '2026-11-20T10:45:00Z'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/ConsentimientoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConsentimientoNoVigente'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/cotizaciones:
    post:
      tags: [cotizacion]
      operationId: cotizar
      summary: Cotizar un seguro según el perfil de riesgo del cliente
      description: >
        Valida el ramo y los datos del bien con el catálogo de ramos y calcula la prima mensual
        con el nivel de riesgo del cliente. Con clienteId y una autorización de datos vigente,
        el núcleo consulta el perfil de riesgo en ms-perfilamiento. Sin clienteId, sin
        autorización vigente o si el perfil no responde a tiempo, usa el valor por defecto
        (nivel MEDIO) y responde calculadaSinPerfil true con su motivoSinPerfil. La oferta es
        válida 7 días desde fechaCotizacion. El BFF agrega el canal antes de llamar al núcleo.
        Con la sesión del cliente, si el cuerpo trae otro clienteId responde 403 SIN_PERMISO,
        y si no lo trae, el BFF pone el del token.
      x-roles: [ASESOR, CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCotizacion'
            examples:
              conCliente:
                $ref: '#/components/examples/SolicitudConCliente'
              sinCliente:
                $ref: '#/components/examples/SolicitudSinCliente'
      responses:
        '201':
          description: Cotización calculada y registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
              examples:
                conPerfil:
                  $ref: '#/components/examples/CotizacionConPerfil'
                sinPerfil:
                  $ref: '#/components/examples/CotizacionSinPerfil'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/SolicitudCotizacionInvalida'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/cotizaciones/{cotizacionId}:
    get:
      tags: [cotizacion]
      operationId: obtenerCotizacion
      summary: Consultar una cotización registrada
      description: >
        Devuelve la cotización como se calculó, con la foto del perfil usado. El estado se
        calcula en cada consulta: VENCIDA cuando ya pasó vigenteHasta. Con la sesión del
        cliente, una cotización que no es suya (sin clienteId o con otro) responde 404
        COTIZACION_NO_ENCONTRADA, para no revelar que existe.
      x-roles: [ASESOR, CLIENTE]
      parameters:
        - $ref: '#/components/parameters/CotizacionId'
      responses:
        '200':
          description: Cotización registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
              examples:
                conPerfil:
                  $ref: '#/components/examples/CotizacionConPerfil'
                sinPerfil:
                  $ref: '#/components/examples/CotizacionSinPerfil'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/CotizacionNoEncontrada'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/cuenta:
    post:
      tags: [cuenta]
      operationId: registrarCuentaCliente
      summary: Enlazar la cuenta del cliente con su registro del núcleo
      description: >
        Último paso de crear cuenta: el cliente ya creó su cuenta de Cognito con su correo y su
        contraseña, confirmó el correo con el código e ingresó. El correo no viaja en el cuerpo:
        el BFF toma el email verificado del token (un correo sin verificar responde 401). El
        núcleo busca al cliente más reciente con ese documento: si no existe lo crea con el
        onboarding de la app (ONBOARDING_EN_CURSO, 201); si existe y su correo coincide con el
        de la cuenta, lo reconoce sin cambiar sus datos (200); si el correo no coincide, el BFF
        responde 409 CUENTA_NO_ENLAZABLE sin decir si el documento existe. Con 200 o 201, el BFF
        escribe en Cognito el nombre, el id del cliente y el documento enmascarado, y agrega la
        cuenta al rol CLIENTE; el portal renueva los tokens para tomarlos. Se puede repetir: con
        los mismos datos responde lo mismo, y una cuenta CLIENTE ya registrada recibe 200 con su
        clienteId. Una cuenta solo se enlaza con un cliente: una cuenta CLIENTE ya registrada
        recibe 200 con su clienteId sin crear otro registro, aunque el cuerpo traiga otro
        documento. El BFF valida el formato con las mismas reglas del onboarding de la app
        (422).
      x-cuenta-sin-rol: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCuentaCliente'
            example:
              documento:
                tipo: CC
                numero: '1020304050'
              nombre:
                nombres: María Fernanda
                apellidos: López Rojas
              celular: '3001234567'
      responses:
        '201':
          description: Cliente nuevo creado con el onboarding en curso y enlazado a la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaCliente'
              example:
                clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
                registro: CREADO
        '200':
          description: >
            El cliente ya existía con ese documento y ese correo (por ejemplo, desde la app), o la
            cuenta ya estaba registrada: queda enlazada a su registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaCliente'
              example:
                clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
                registro: ENLAZADO
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/CuentaNoEnlazable'
        '422':
          description: El cuerpo no cumple el contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                detail:
                  - loc: [body, celular]
                    msg: "String should match pattern '^3\\d{9}$'"
                    type: string_pattern_mismatch
        '503':
          $ref: '#/components/responses/NucleoOIdentidadNoDisponible'
  /v1/trazabilidad/decisiones-precio/{cotizacionId}:
    get:
      tags: [trazabilidad]
      operationId: reconstruirDecisionPrecio
      summary: Reconstruir la decisión de precio de una cotización
      description: >
        La reconstrucción del núcleo tal como la define la SOLVENTAG5-128 (ADR 0006): entradas,
        regla con sus parámetros tal como se aplicaron, resultado, explicación en texto y
        verificación (prima recalculada solo con lo guardado y huella de integridad). Las
        entradas incluyen el solicitante (id y rol de quien pidió la cotización) cuando lo hubo.
        El BFF la reenvía sin cambios.
      x-roles: [ANALISTA_RIESGO, OPERACIONES]
      parameters:
        - $ref: '#/components/parameters/CotizacionId'
      responses:
        '200':
          description: Decisión de precio reconstruida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconstruccionDecision'
              examples:
                conSolicitante:
                  $ref: '#/components/examples/ReconstruccionConSolicitante'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/DecisionNoEncontrada'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/solicitudes-suscripcion:
    post:
      tags: [suscripcion]
      operationId: aceptarOferta
      summary: Aceptar la oferta de una cotización
      description: >
        Crea la solicitud de suscripción de la oferta aceptada, con la prima, la cobertura y el
        perfil de riesgo con que se calculó la cotización. La solicitud queda en
        PENDIENTE_EVALUACION. Una oferta genera una sola solicitud: si se acepta otra vez (por
        ejemplo, un doble clic), responde 200 con la solicitud que ya existía, aunque la oferta
        haya vencido después. Si la oferta ya venció (después de vigenteHasta) y no se había
        aceptado, no se crea la solicitud: responde 409 OFERTA_VENCIDA y la pantalla ofrece
        recotizar. El BFF agrega el canal antes de llamar al núcleo. El asesor acepta en nombre
        del cliente; con la sesión del cliente, una cotización que no es suya (sin clienteId o
        con otro) responde 404 COTIZACION_NO_ENCONTRADA y no se acepta.
      x-roles: [ASESOR, CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceptacionOferta'
            example:
              cotizacionId: 5d2c8b1a-4e3f-4a6b-9c7d-8e1f2a3b4c5d
      responses:
        '200':
          description: La oferta ya se había aceptado; es la solicitud existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSuscripcion'
              examples:
                conPerfil:
                  $ref: '#/components/examples/SolicitudSuscripcionCreada'
        '201':
          description: Solicitud de suscripción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSuscripcion'
              examples:
                conPerfil:
                  $ref: '#/components/examples/SolicitudSuscripcionCreada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/CotizacionNoEncontrada'
        '409':
          $ref: '#/components/responses/OfertaVencida'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/solicitudes-suscripcion/{solicitudId}:
    get:
      tags: [suscripcion]
      operationId: obtenerSolicitudSuscripcion
      summary: Consultar una solicitud de suscripción
      description: >
        Devuelve la solicitud con su estado. Queda en PENDIENTE_EVALUACION hasta que la evalúe
        la suscripción automática (SOLVENTAG5-50). Con la sesión del cliente, una solicitud que
        no es suya (sin clienteId o con otro) responde 404 SOLICITUD_SUSCRIPCION_NO_ENCONTRADA,
        para no revelar que existe.
      x-roles: [ASESOR, CLIENTE]
      parameters:
        - $ref: '#/components/parameters/SolicitudSuscripcionId'
      responses:
        '200':
          description: Solicitud de suscripción registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSuscripcion'
              examples:
                conPerfil:
                  $ref: '#/components/examples/SolicitudSuscripcionCreada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/SolicitudSuscripcionNoEncontrada'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
  /v1/solicitudes-suscripcion/{solicitudId}/perfil-riesgo:
    get:
      tags: [suscripcion]
      operationId: obtenerPerfilRiesgoSolicitud
      summary: Consultar el perfil de riesgo con que se cotizó una solicitud
      description: >
        Devuelve al responsable de suscripción el mismo perfil de riesgo con que se calculó la
        cotización de la solicitud (SOLVENTAG5-67): la foto que la cotización guardó al cotizar,
        con su versión, score, nivel y señales. No se recalcula ni se consulta otra vez a
        ms-perfilamiento, aunque el perfil del cliente haya cambiado después. Si la prima se
        calculó con el valor por defecto de BA-01, origen es VALOR_POR_DEFECTO y motivoSinPerfil
        dice por qué. Si la foto de la cotización no coincide con el perfil y la versión que
        guardó la solicitud, responde 409 PERFIL_NO_COINCIDE.
      x-roles: [ANALISTA_RIESGO]
      parameters:
        - $ref: '#/components/parameters/SolicitudSuscripcionId'
      responses:
        '200':
          description: Perfil de riesgo con que se cotizó la solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRiesgoSolicitud'
              examples:
                conPerfil:
                  $ref: '#/components/examples/PerfilRiesgoConPerfil'
                sinPerfil:
                  $ref: '#/components/examples/PerfilRiesgoSinPerfil'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/SolicitudSuscripcionNoEncontrada'
        '409':
          $ref: '#/components/responses/PerfilNoCoincide'
        '422':
          $ref: '#/components/responses/Validacion'
        '503':
          $ref: '#/components/responses/NucleoNoDisponible'
components:
  securitySchemes:
    tokenCognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        ID token que emite el user pool de Cognito del ambiente al cliente del portal web (no el
        token de acceso). El BFF valida la firma con las llaves públicas del user pool, el
        emisor, la audiencia, token_use = id y el vencimiento. El rol es el único grupo de
        Cognito del usuario.
  parameters:
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      description: Id aleatorio (UUID v4) de la solicitud; es el que va en el enlace del cliente.
      schema:
        type: string
        format: uuid
    ConsentimientoId:
      name: consentimientoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CotizacionId:
      name: cotizacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolicitudSuscripcionId:
      name: solicitudId
      in: path
      required: true
      description: Id (UUID v4) de la solicitud de suscripción.
      schema:
        type: string
        format: uuid
  responses:
    NoAutenticado:
      description: >
        Sin token, o con un token que no es válido (firma, emisor, audiencia, tipo o vencimiento)
        o que no corresponde a una sesión completa: sin exactamente un rol, o un CLIENTE sin su
        id de cliente. La cuenta de un cliente sin registrar solo se atiende en
        registrarCuentaCliente; en cualquier otra operación responde 401.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: NO_AUTENTICADO
          example:
            codigo: NO_AUTENTICADO
            detalle: Inicia sesión para continuar.
    SinPermiso:
      description: >
        El rol de la sesión no puede llamar esta operación (x-roles), o el cliente pide datos
        de otro cliente.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: SIN_PERMISO
          example:
            codigo: SIN_PERMISO
            detalle: No tienes permiso para esta operación.
    CuentaNoEnlazable:
      description: >
        La cuenta no se puede enlazar con esos datos: el cliente con ese documento tiene otro
        correo, o la cuenta ya está enlazada con otro cliente. No dice si el documento existe.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: CUENTA_NO_ENLAZABLE
          example:
            codigo: CUENTA_NO_ENLAZABLE
            detalle: No pudimos crear la cuenta con esos datos.
    DecisionNoEncontrada:
      description: No hay un registro de decisión de precio para esa cotización.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: DECISION_NO_ENCONTRADA
          example:
            codigo: DECISION_NO_ENCONTRADA
            detalle: No hay un registro de decisión de precio para esa cotización.
    NucleoOIdentidadNoDisponible:
      description: >
        El BFF no alcanza al núcleo (NUCLEO_NO_DISPONIBLE) o no pudo escribir en Cognito los
        datos o el rol de la cuenta (IDENTIDAD_NO_DISPONIBLE). Repetir la llamada es seguro.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    enum: [NUCLEO_NO_DISPONIBLE, IDENTIDAD_NO_DISPONIBLE]
          examples:
            nucleoNoDisponible:
              summary: El núcleo no responde
              value:
                codigo: NUCLEO_NO_DISPONIBLE
                detalle: El servicio no está disponible. Intenta de nuevo en unos minutos.
            identidadNoDisponible:
              summary: Cognito no responde
              value:
                codigo: IDENTIDAD_NO_DISPONIBLE
                detalle: >-
                  El servicio de identidad no está disponible. Intenta de nuevo en unos
                  minutos.
    ClienteYaAutorizado:
      description: El cliente ya tiene un consentimiento vigente y no vencido.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: CLIENTE_YA_AUTORIZADO
          example:
            codigo: CLIENTE_YA_AUTORIZADO
            detalle: El cliente ya tiene una autorización vigente.
    ClienteNoEncontrado:
      description: No hay un cliente registrado con ese documento.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: CLIENTE_NO_ENCONTRADO
          example:
            codigo: CLIENTE_NO_ENCONTRADO
            detalle: No encontramos un cliente con ese documento.
    SolicitudNoEncontrada:
      description: La solicitud no existe.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: SOLICITUD_NO_ENCONTRADA
          example:
            codigo: SOLICITUD_NO_ENCONTRADA
            detalle: No encontramos la solicitud de autorización.
    SolicitudYaRespondida:
      description: La solicitud ya no está PENDIENTE.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: SOLICITUD_YA_RESPONDIDA
          example:
            codigo: SOLICITUD_YA_RESPONDIDA
            detalle: La solicitud ya fue respondida.
    PoliticaNoAceptadaOValidacion:
      description: >
        AUTORIZAR sin aceptar la política vigente (Error con codigo POLITICA_NO_ACEPTADA), o
        un cuerpo mal formado (ErrorValidacion).
      content:
        application/json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      codigo:
                        const: POLITICA_NO_ACEPTADA
              - $ref: '#/components/schemas/ErrorValidacion'
          examples:
            politicaNoAceptada:
              summary: No aceptó la política vigente
              value:
                codigo: POLITICA_NO_ACEPTADA
                detalle: Para autorizar debes aceptar la política de tratamiento de datos vigente.
            validacion:
              summary: Cuerpo mal formado
              value:
                detail:
                  - loc: [body, decision]
                    msg: "Input should be 'AUTORIZAR' or 'NO_AUTORIZAR'"
                    type: enum
    ConsentimientoNoEncontrado:
      description: El consentimiento no existe.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: CONSENTIMIENTO_NO_ENCONTRADO
          example:
            codigo: CONSENTIMIENTO_NO_ENCONTRADO
            detalle: No encontramos el consentimiento.
    ConsentimientoNoVigente:
      description: El consentimiento ya está revocado o vencido.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: CONSENTIMIENTO_NO_VIGENTE
          example:
            codigo: CONSENTIMIENTO_NO_VIGENTE
            detalle: El consentimiento no está vigente.
    CotizacionNoEncontrada:
      description: La cotización no existe.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: COTIZACION_NO_ENCONTRADA
          example:
            codigo: COTIZACION_NO_ENCONTRADA
            detalle: No encontramos la cotización.
    SolicitudCotizacionInvalida:
      description: >
        Un ramo que no está en el catálogo (Error con codigo RAMO_NO_SOPORTADO), datos del bien
        que no cumplen las reglas del ramo (Error con codigo DATOS_BIEN_INVALIDOS y la lista
        campos con todos los que fallan) o un cuerpo mal formado (ErrorValidacion).
        El BFF valida solo la forma del cuerpo (tipos y campos obligatorios) y lo reenvía al
        núcleo. El catálogo de ramos y los rangos de los datos del bien los aplica solo el
        núcleo, que responde RAMO_NO_SOPORTADO o DATOS_BIEN_INVALIDOS. Los rangos de este
        contrato sirven para que la pantalla valide antes de enviar.
      content:
        application/json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      codigo:
                        enum: [DATOS_BIEN_INVALIDOS, RAMO_NO_SOPORTADO]
              - $ref: '#/components/schemas/ErrorValidacion'
          examples:
            datosBienInvalidos:
              summary: Datos del bien fuera de las reglas del ramo
              value:
                codigo: DATOS_BIEN_INVALIDOS
                detalle: Los datos del bien no cumplen las reglas del ramo.
                campos: [montoCredito, plazoAnios]
            ramoNoSoportado:
              summary: Ramo que no está en el catálogo
              value:
                codigo: RAMO_NO_SOPORTADO
                detalle: El ramo no está disponible para cotizar.
            validacion:
              summary: Cuerpo mal formado
              value:
                detail:
                  - loc: [body, datosBien, montoCredito]
                    msg: 'Input should be a valid integer'
                    type: int_type
    Validacion:
      description: La petición no cumple el contrato (parámetros o cuerpo).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
          example:
            detail:
              - loc: [path, clienteId]
                msg: 'Input should be a valid UUID'
                type: uuid_parsing
    OfertaVencida:
      description: >
        La oferta se aceptó después de su vigencia. No se crea la solicitud: la pantalla ofrece
        recotizar con los mismos datos.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: OFERTA_VENCIDA
          example:
            codigo: OFERTA_VENCIDA
            detalle: La oferta venció. Cotiza de nuevo para obtener una oferta vigente.
    SolicitudSuscripcionNoEncontrada:
      description: La solicitud de suscripción no existe.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: SOLICITUD_SUSCRIPCION_NO_ENCONTRADA
          example:
            codigo: SOLICITUD_SUSCRIPCION_NO_ENCONTRADA
            detalle: No encontramos la solicitud de suscripción.
    PerfilNoCoincide:
      description: >
        La foto del perfil que guardó la cotización no coincide con el perfil y la versión de la
        solicitud. No se devuelve un perfil distinto al cotizado.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: PERFIL_NO_COINCIDE
          example:
            codigo: PERFIL_NO_COINCIDE
            detalle: El perfil de riesgo de la cotización no coincide con el de la solicitud.
    NucleoNoDisponible:
      description: El BFF no alcanza al núcleo (5xx, tiempo de espera o conexión rechazada).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  codigo:
                    const: NUCLEO_NO_DISPONIBLE
          example:
            codigo: NUCLEO_NO_DISPONIBLE
            detalle: El servicio no está disponible. Intenta de nuevo en unos minutos.
  schemas:
    EstadoSolicitud:
      type: string
      enum: [PENDIENTE, AUTORIZADA, NO_AUTORIZADA]
    EstadoConsentimiento:
      type: string
      description: VENCIDO no se guarda; se calcula a partir de fechaVencimiento.
      enum: [VIGENTE, REVOCADO, VENCIDO]
    EstadoAutorizacion:
      type: string
      enum: [SIN_SOLICITAR, ESPERANDO_CLIENTE, AUTORIZADA, REVOCADA, VENCIDA]
    TipoDecision:
      type: string
      enum: [AUTORIZAR, NO_AUTORIZAR]
    FuenteDatos:
      type: string
      enum: [OPEN_FINANCE, OPEN_DATA]
    CodigoDato:
      type: string
      enum:
        - COMPORTAMIENTO_PAGO
        - ESTABILIDAD_INGRESOS
        - SOCIODEMOGRAFICA_TERRITORIAL
        - SALUD_ACTUARIAL_AGREGADA
        - INMUEBLE_UBICACION
    CodigoEntidad:
      type: string
      enum: [ENTIDADES_FINANZAS_ABIERTAS, DANE, MINSALUD, IGAC]
    Finalidad:
      type: string
      enum: [PERFILAMIENTO_VIDA_HIPOTECARIO]
    Destinatario:
      type: string
      enum: [SOLVENTA]
    BaseLegal:
      type: string
      enum: [LEY_1581_2012, DECRETO_1297_2022]
    PedirAutorizacion:
      type: object
      properties:
        asesor:
          type: object
          deprecated: true
          description: >
            Obsoleto y opcional. El BFF lo ignora: envía al núcleo el asesor del token (su id y
            su nombre).
          required: [id, nombre]
          properties:
            id:
              type: string
              minLength: 1
              description: Id del asesor.
            nombre:
              type: string
              minLength: 1
              description: Nombre que se le muestra al cliente.
    SolicitudEnviada:
      type: object
      required: [solicitudId, estado, fechaSolicitud, envios, reenviada, enlace]
      properties:
        solicitudId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        fechaSolicitud:
          type: string
          format: date-time
        envios:
          type: integer
          minimum: 1
          description: Veces que se ha enviado la solicitud; empieza en 1.
        reenviada:
          type: boolean
          description: true si se reenvió una solicitud pendiente que ya existía.
        enlace:
          type: string
          format: uri
          description: Enlace del portal web que abre el cliente.
    SolicitudParaCliente:
      type: object
      description: No incluye clienteId ni el id del asesor (minimización).
      required: [solicitudId, estado, asesor, fechaSolicitud, catalogo, condiciones]
      properties:
        solicitudId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        asesor:
          type: object
          required: [nombre]
          properties:
            nombre:
              type: string
        fechaSolicitud:
          type: string
          format: date-time
        catalogo:
          $ref: '#/components/schemas/Catalogo'
        condiciones:
          $ref: '#/components/schemas/Condiciones'
        fechaDecision:
          type: string
          format: date-time
          description: Solo cuando la solicitud ya fue respondida.
    Catalogo:
      type: object
      required: [version, fuentes]
      properties:
        version:
          type: string
          examples: [v1]
        fuentes:
          type: array
          items:
            type: object
            required: [fuente, datos]
            properties:
              fuente:
                $ref: '#/components/schemas/FuenteDatos'
              datos:
                type: array
                items:
                  type: object
                  required: [codigo, entidades]
                  properties:
                    codigo:
                      $ref: '#/components/schemas/CodigoDato'
                    entidades:
                      type: array
                      items:
                        $ref: '#/components/schemas/CodigoEntidad'
    Condiciones:
      type: object
      required: [duracionMeses, finalidad, destinatario, baseLegal, versionPolitica]
      properties:
        duracionMeses:
          type: integer
          minimum: 1
          examples: [12]
        finalidad:
          $ref: '#/components/schemas/Finalidad'
        destinatario:
          $ref: '#/components/schemas/Destinatario'
        baseLegal:
          type: array
          items:
            $ref: '#/components/schemas/BaseLegal'
        versionPolitica:
          type: string
          examples: [v1]
    DecisionSolicitud:
      type: object
      required: [decision, aceptaPolitica, versionPolitica]
      properties:
        decision:
          $ref: '#/components/schemas/TipoDecision'
        aceptaPolitica:
          type: boolean
          description: Debe ser true para AUTORIZAR.
        versionPolitica:
          type: string
          description: Para AUTORIZAR debe ser la versión vigente de la política.
          examples: [v1]
    ResultadoDecision:
      type: object
      required: [solicitudId, estado]
      properties:
        solicitudId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        consentimiento:
          $ref: '#/components/schemas/Consentimiento'
          description: Solo cuando la decisión es AUTORIZAR.
    Consentimiento:
      type: object
      required:
        - consentimientoId
        - estado
        - alcance
        - finalidad
        - destinatario
        - versionCatalogo
        - versionPolitica
        - fechaOtorga
        - fechaVencimiento
      properties:
        consentimientoId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoConsentimiento'
        alcance:
          type: array
          description: Códigos del catálogo que se autorizaron.
          items:
            $ref: '#/components/schemas/CodigoDato'
        finalidad:
          $ref: '#/components/schemas/Finalidad'
        destinatario:
          $ref: '#/components/schemas/Destinatario'
        versionCatalogo:
          type: string
          examples: [v1]
        versionPolitica:
          type: string
          examples: [v1]
        fechaOtorga:
          type: string
          format: date-time
        fechaVencimiento:
          type: string
          format: date-time
          description: fechaOtorga + 12 meses.
        fechaRevoca:
          type: string
          format: date-time
          description: Solo cuando el consentimiento fue revocado.
    ConsentimientosCliente:
      type: object
      required: [clienteId, consentimientos]
      properties:
        clienteId:
          type: string
          format: uuid
        consentimientos:
          type: array
          description: Primero los VIGENTES; vacía si el cliente no ha otorgado ninguno.
          items:
            $ref: '#/components/schemas/Consentimiento'
    EstadoAutorizacionCliente:
      type: object
      required: [clienteId, estado]
      properties:
        clienteId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoAutorizacion'
        fechaEstado:
          type: string
          format: date-time
          description: Fecha del evento que fija el estado; no aplica a SIN_SOLICITAR.
        solicitudId:
          type: string
          format: uuid
        consentimientoId:
          type: string
          format: uuid
        fechaVencimiento:
          type: string
          format: date-time
    TipoDocumento:
      type: string
      description: >
        CC cédula de ciudadanía, CE cédula de extranjería, PA pasaporte, PPT permiso por
        protección temporal.
      enum: [CC, CE, PA, PPT]
    BusquedaCliente:
      type: object
      required: [tipoDocumento, numeroDocumento]
      properties:
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumento'
        numeroDocumento:
          type: string
          description: >
            CC, CE y PPT: de 6 a 10 dígitos. PA: de 6 a 12 letras o dígitos. Se busca sin
            espacios al inicio y al final.
          pattern: '^[A-Za-z0-9]{6,12}$'
          examples: ['1020305678', AB123456]
    ClienteEncontrado:
      type: object
      description: Datos mínimos para identificar al cliente en la pantalla (minimización).
      required: [clienteId, nombres, apellidos, documentoEnmascarado]
      properties:
        clienteId:
          type: string
          format: uuid
        nombres:
          type: string
        apellidos:
          type: string
        documentoEnmascarado:
          type: string
          description: El tipo de documento y los cuatro últimos caracteres del número.
          pattern: '^(CC|CE|PA|PPT) ••••[A-Za-z0-9]{4}$'
          examples: [CC ••••5678]
    Ramo:
      type: string
      description: Código del catálogo de ramos v1.
      enum: [VIDA_HIPOTECARIO]
    NivelRiesgo:
      type: string
      enum: [BAJO, MEDIO, ALTO]
    EstadoCotizacion:
      type: string
      description: VENCIDA no se guarda; se calcula a partir de vigenteHasta.
      enum: [VIGENTE, VENCIDA]
    MotivoSinPerfil:
      type: string
      description: >
        Por qué la prima se calculó con el valor por defecto. SIN_CLIENTE no llegó clienteId;
        SIN_CONSENTIMIENTO el cliente no tiene una autorización de datos vigente;
        PERFIL_NO_DISPONIBLE ms-perfilamiento no respondió a tiempo o falló.
      enum: [SIN_CLIENTE, SIN_CONSENTIMIENTO, PERFIL_NO_DISPONIBLE]
    DatosBienVidaHipotecario:
      type: object
      description: >
        Datos del bien del ramo VIDA_HIPOTECARIO. Los textos se guardan sin espacios al inicio y
        al final.
      required: [montoCredito, plazoAnios, ciudadInmueble, entidadAcreedora]
      properties:
        montoCredito:
          type: integer
          minimum: 10000000
          maximum: 1200000000
          description: Monto del crédito hipotecario en COP.
          examples: [200000000]
        plazoAnios:
          type: integer
          minimum: 5
          maximum: 30
          description: Plazo del crédito en años.
          examples: [20]
        ciudadInmueble:
          type: string
          minLength: 2
          maxLength: 80
          examples: [Bogotá]
        entidadAcreedora:
          type: string
          minLength: 2
          maxLength: 120
          description: Entidad que otorga el crédito.
          examples: [Banco de Ejemplo]
    SolicitudCotizacion:
      type: object
      required: [ramo, datosBien]
      properties:
        ramo:
          $ref: '#/components/schemas/Ramo'
        datosBien:
          $ref: '#/components/schemas/DatosBienVidaHipotecario'
        clienteId:
          type: string
          format: uuid
          description: Opcional. Sin él la prima usa el valor por defecto (motivo SIN_CLIENTE).
    Senal:
      type: integer
      minimum: 0
      maximum: 100
    SenalesPerfil:
      type: object
      description: Indicadores de 0 a 100 que explican el nivel; no son datos crudos de Open Finance.
      required: [comportamientoPago, estabilidadIngresos, ubicacion, endeudamiento]
      properties:
        comportamientoPago:
          $ref: '#/components/schemas/Senal'
        estabilidadIngresos:
          $ref: '#/components/schemas/Senal'
        ubicacion:
          $ref: '#/components/schemas/Senal'
        endeudamiento:
          $ref: '#/components/schemas/Senal'
    PerfilUsado:
      type: object
      description: Foto del perfil de riesgo con que se calculó la prima.
      required: [perfilId, version, score, nivel, senales, calculadoEn, vigenteHasta]
      properties:
        perfilId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        score:
          type: integer
          minimum: 0
          maximum: 850
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        senales:
          $ref: '#/components/schemas/SenalesPerfil'
        calculadoEn:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
          description: Hasta cuándo ms-perfilamiento considera vigente el perfil.
    Cotizacion:
      type: object
      required:
        - cotizacionId
        - ramo
        - datosBien
        - prima
        - moneda
        - periodicidad
        - fechaCotizacion
        - vigenteHasta
        - estado
        - calculadaSinPerfil
      properties:
        cotizacionId:
          type: string
          format: uuid
        ramo:
          $ref: '#/components/schemas/Ramo'
        datosBien:
          $ref: '#/components/schemas/DatosBienVidaHipotecario'
        clienteId:
          type: string
          format: uuid
          description: Solo si la solicitud lo trajo.
        prima:
          type: integer
          minimum: 0
          description: Prima en COP, redondeada al peso.
        moneda:
          type: string
          enum: [COP]
        periodicidad:
          type: string
          enum: [MENSUAL]
        fechaCotizacion:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
          description: Fin de la vigencia de la oferta, fechaCotizacion + 7 días.
        estado:
          $ref: '#/components/schemas/EstadoCotizacion'
        calculadaSinPerfil:
          type: boolean
          description: >
            true si la prima se calculó con el valor por defecto de BA-01 (nivel MEDIO) y no con
            el perfil del cliente.
        motivoSinPerfil:
          $ref: '#/components/schemas/MotivoSinPerfil'
          description: Solo cuando calculadaSinPerfil es true.
        perfil:
          $ref: '#/components/schemas/PerfilUsado'
          description: Solo cuando calculadaSinPerfil es false.
    AceptacionOferta:
      type: object
      required: [cotizacionId]
      properties:
        cotizacionId:
          type: string
          format: uuid
    CanalOrigen:
      type: string
      description: Canal por el que el cliente aceptó la oferta; lo pone el BFF.
      enum: [web, movil, socio]
    EstadoSolicitudSuscripcion:
      type: string
      description: >
        PENDIENTE_EVALUACION al crearse; la evaluación automática (SOLVENTAG5-50) agrega los
        estados siguientes.
      enum: [PENDIENTE_EVALUACION]
    Cobertura:
      type: object
      required: [ramo, datosBien]
      properties:
        ramo:
          type: string
          description: Código del ramo cotizado, p. ej. VIDA_HIPOTECARIO.
        datosBien:
          type: object
          additionalProperties: true
          description: Datos del bien con que se cotizó (para vida hipotecario, DatosBienVidaHipotecario).
    PerfilRiesgo:
      type: object
      required: [perfilId, version]
      properties:
        perfilId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
    SolicitudSuscripcion:
      type: object
      required:
        - solicitudId
        - cotizacionId
        - estado
        - cobertura
        - prima
        - moneda
        - periodicidad
        - canal
        - aceptadaEn
      properties:
        solicitudId:
          type: string
          format: uuid
        cotizacionId:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoSolicitudSuscripcion'
        cobertura:
          $ref: '#/components/schemas/Cobertura'
        prima:
          type: integer
          minimum: 0
          description: Prima en COP de la oferta aceptada, redondeada al peso.
        moneda:
          type: string
        periodicidad:
          type: string
        perfilRiesgo:
          $ref: '#/components/schemas/PerfilRiesgo'
          description: Perfil con que se calculó la prima; ausente si se cotizó sin perfil.
        motivoSinPerfil:
          type: string
          description: SIN_CLIENTE, SIN_CONSENTIMIENTO o PERFIL_NO_DISPONIBLE; solo sin perfil.
        canal:
          $ref: '#/components/schemas/CanalOrigen'
        aceptadaEn:
          type: string
          format: date-time
    Rol:
      type: string
      description: 'Rol del usuario: el nombre exacto de su grupo de Cognito.'
      enum: [ASESOR, CLIENTE, ANALISTA_RIESGO, OPERACIONES, SOCIO]
    Nombre:
      type: string
      description: >
        Solo letras (con tildes y ñ), separadas por un espacio, un apóstrofo o un guion.
      minLength: 2
      maxLength: 60
      pattern: "^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+([ '\\-][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*$"
      examples: [María Fernanda, O'Neill, Pérez-Gómez]
    RegistroCuentaCliente:
      type: object
      description: >
        Datos básicos del cliente, con las mismas reglas de formato del onboarding de la app
        (DatosBasicosCliente del contrato del BFF móvil). El correo no va en el cuerpo: es el
        email verificado del token. Se quitan los espacios al inicio y al final de cada texto.
      additionalProperties: false
      required: [documento, nombre, celular]
      properties:
        documento:
          type: object
          additionalProperties: false
          required: [tipo, numero]
          properties:
            tipo:
              $ref: '#/components/schemas/TipoDocumento'
            numero:
              type: string
              description: >
                CC, CE y PPT: de 6 a 10 dígitos. PA: de 6 a 12 letras o dígitos.
              pattern: '^[A-Za-z0-9]{6,12}$'
              examples: ['1020304050', AB123456]
        nombre:
          type: object
          additionalProperties: false
          required: [nombres, apellidos]
          properties:
            nombres:
              $ref: '#/components/schemas/Nombre'
            apellidos:
              $ref: '#/components/schemas/Nombre'
        celular:
          type: string
          description: Celular colombiano de 10 dígitos, sin indicativo ni separadores.
          pattern: '^3\d{9}$'
          examples: ['3001234567']
    RegistroCuenta:
      type: string
      description: >
        CREADO el cliente no existía y se creó con el onboarding en curso (201). ENLAZADO el
        cliente ya existía con ese documento y ese correo, o la cuenta ya estaba registrada
        (200).
      enum: [CREADO, ENLAZADO]
    CuentaCliente:
      type: object
      description: >
        Solo el id del cliente y el resultado (minimización). El nombre y el documento
        enmascarado llegan en el token renovado.
      required: [clienteId, registro]
      properties:
        clienteId:
          type: string
          format: uuid
        registro:
          $ref: '#/components/schemas/RegistroCuenta'
    Solicitante:
      type: object
      description: >
        Quién pidió la cotización: el usuario de la sesión que llegó hasta el núcleo.
      required: [id, rol]
      properties:
        id:
          type: string
          description: Id del usuario en Cognito (sub).
        rol:
          $ref: '#/components/schemas/Rol'
    EntradasDecisionPrecio:
      type: object
      description: >
        Entradas tal como se guardaron en el registro de la decisión. Los opcionales que no
        aplican van en null. Los registros anteriores a la SOLVENTAG5-207 no tienen la llave
        solicitante.
      required:
        - ramo
        - canal
        - clienteId
        - socioId
        - datosBien
        - perfil
        - motivoSinPerfil
        - nivelRiesgo
        - origenNivel
      properties:
        ramo:
          type: string
        canal:
          type: string
          enum: [web, movil, socio]
        clienteId:
          type: [string, 'null']
          format: uuid
        socioId:
          type: [string, 'null']
        datosBien:
          type: object
          description: Datos del bien validados, con la forma de los del ramo.
        perfil:
          type: [object, 'null']
          description: Foto del perfil usado, con la forma de PerfilUsado; null sin perfil.
        motivoSinPerfil:
          anyOf:
            - $ref: '#/components/schemas/MotivoSinPerfil'
            - type: 'null'
        nivelRiesgo:
          $ref: '#/components/schemas/NivelRiesgo'
        origenNivel:
          type: string
          enum: [PERFIL, VALOR_POR_DEFECTO]
        solicitante:
          description: >
            Quién pidió la cotización; null si llegó sin usuario (por ejemplo, desde la app).
            Falta en los registros anteriores a la SOLVENTAG5-207.
          anyOf:
            - $ref: '#/components/schemas/Solicitante'
            - type: 'null'
    VerificacionDecision:
      type: object
      required: [primaRecalculada, primaCoincide, huellaValida, reconstruible]
      properties:
        primaRecalculada:
          type: integer
          description: Prima recalculada solo con el registro guardado.
        primaCoincide:
          type: boolean
        huellaValida:
          type: boolean
          description: El registro no cambió desde que se escribió.
        reconstruible:
          type: boolean
          description: Íntegro y explica exactamente la prima cobrada.
    ReconstruccionDecision:
      type: object
      description: >
        Decisión de precio reconstruida para actuaría y cumplimiento (SOLVENTAG5-128, ADR 0006),
        con la forma de la respuesta del núcleo.
      required:
        - cotizacionId
        - tipo
        - registradaEn
        - regla
        - parametros
        - entradas
        - resultado
        - retenerHasta
        - huella
        - verificacion
        - explicacion
      properties:
        cotizacionId:
          type: string
          format: uuid
        tipo:
          type: string
          const: PRECIO
        registradaEn:
          type: string
          format: date-time
        regla:
          type: string
          description: Código y versión de la regla, p. ej. VIDA_HIPOTECARIO.TARIFA.v1
        parametros:
          type: object
          description: Parámetros de la regla tal como se aplicaron, como texto.
          additionalProperties:
            type: string
        entradas:
          $ref: '#/components/schemas/EntradasDecisionPrecio'
        resultado:
          type: object
          description: Prima, moneda y periodicidad, como texto.
          additionalProperties:
            type: string
        retenerHasta:
          type: string
          format: date-time
          description: 'Retención de 10 años: no se borra antes.'
        huella:
          type: string
          description: SHA-256 del contenido del registro.
        verificacion:
          $ref: '#/components/schemas/VerificacionDecision'
        explicacion:
          type: string
    OrigenPerfil:
      type: string
      description: >
        PERFIL si la prima se calculó con el perfil del cliente; VALOR_POR_DEFECTO si se calculó
        con el valor por defecto de BA-01 porque no había perfil.
      enum: [PERFIL, VALOR_POR_DEFECTO]
    PerfilRiesgoSolicitud:
      type: object
      required: [solicitudId, cotizacionId, origen]
      properties:
        solicitudId:
          type: string
          format: uuid
        cotizacionId:
          type: string
          format: uuid
        origen:
          $ref: '#/components/schemas/OrigenPerfil'
        perfil:
          $ref: '#/components/schemas/PerfilUsado'
          description: Solo cuando origen es PERFIL.
        motivoSinPerfil:
          $ref: '#/components/schemas/MotivoSinPerfil'
          description: Solo cuando origen es VALOR_POR_DEFECTO.
    Error:
      type: object
      required: [codigo, detalle]
      properties:
        codigo:
          type: string
          description: >
            Código estable del error. Los de esta versión son NO_AUTENTICADO, SIN_PERMISO,
            SOLICITUD_NO_ENCONTRADA, SOLICITUD_YA_RESPONDIDA, POLITICA_NO_ACEPTADA,
            CONSENTIMIENTO_NO_ENCONTRADO, CONSENTIMIENTO_NO_VIGENTE, CLIENTE_YA_AUTORIZADO,
            CLIENTE_NO_ENCONTRADO, DATOS_BIEN_INVALIDOS, RAMO_NO_SOPORTADO,
            COTIZACION_NO_ENCONTRADA, OFERTA_VENCIDA, SOLICITUD_SUSCRIPCION_NO_ENCONTRADA,
            PERFIL_NO_COINCIDE, CUENTA_NO_ENLAZABLE, DECISION_NO_ENCONTRADA,
            NUCLEO_NO_DISPONIBLE e IDENTIDAD_NO_DISPONIBLE.
        detalle:
          type: string
          description: Explicación legible; no la muestres tal cual en la interfaz.
        campos:
          type: array
          description: Solo en DATOS_BIEN_INVALIDOS. Nombres de todos los campos que fallan.
          items:
            type: string
          examples: [[montoCredito, plazoAnios]]
    ErrorValidacion:
      type: object
      description: Error de validación de la petición, con la forma que genera FastAPI.
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
  examples:
    SolicitudConCliente:
      summary: Cliente identificado
      value:
        ramo: VIDA_HIPOTECARIO
        datosBien:
          montoCredito: 200000000
          plazoAnios: 20
          ciudadInmueble: Bogotá
          entidadAcreedora: Banco de Ejemplo
        clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
    SolicitudSinCliente:
      summary: Sin clienteId (prima con el valor por defecto)
      value:
        ramo: VIDA_HIPOTECARIO
        datosBien:
          montoCredito: 200000000
          plazoAnios: 20
          ciudadInmueble: Bogotá
          entidadAcreedora: Banco de Ejemplo
    CotizacionConPerfil:
      summary: Con perfil MEDIO, crédito de 200.000.000 y prima de 70.000
      value:
        cotizacionId: 5d2c8b1a-4e3f-4a6b-9c7d-8e1f2a3b4c5d
        ramo: VIDA_HIPOTECARIO
        datosBien:
          montoCredito: 200000000
          plazoAnios: 20
          ciudadInmueble: Bogotá
          entidadAcreedora: Banco de Ejemplo
        clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
        prima: 70000
        moneda: COP
        periodicidad: MENSUAL
        fechaCotizacion: '2026-10-13T15:00:00Z'
        vigenteHasta: '2026-10-20T15:00:00Z'
        estado: VIGENTE
        calculadaSinPerfil: false
        perfil:
          perfilId: 2a4b6c8d-1e3f-4a5b-8c7d-9e0f1a2b3c4d
          version: 3
          score: 640
          nivel: MEDIO
          senales:
            comportamientoPago: 72
            estabilidadIngresos: 65
            ubicacion: 58
            endeudamiento: 41
          calculadoEn: '2026-10-13T14:59:59Z'
          vigenteHasta: '2026-10-14T14:59:59Z'
    CotizacionSinPerfil:
      summary: Sin perfil porque ms-perfilamiento no respondió a tiempo
      value:
        cotizacionId: 8f1e2d3c-4b5a-4c6d-9e7f-0a1b2c3d4e5f
        ramo: VIDA_HIPOTECARIO
        datosBien:
          montoCredito: 200000000
          plazoAnios: 20
          ciudadInmueble: Bogotá
          entidadAcreedora: Banco de Ejemplo
        clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
        prima: 70000
        moneda: COP
        periodicidad: MENSUAL
        fechaCotizacion: '2026-10-13T15:00:00Z'
        vigenteHasta: '2026-10-20T15:00:00Z'
        estado: VIGENTE
        calculadaSinPerfil: true
        motivoSinPerfil: PERFIL_NO_DISPONIBLE
    ReconstruccionConSolicitante:
      summary: Cotización del asesor con perfil MEDIO, reconstruible
      description: >
        Generado con el código del núcleo de la SOLVENTAG5-128 más el solicitante de la
        SOLVENTAG5-207. La frase de quién pidió la cotización al final de la explicación es
        ilustrativa: su redacción exacta la fija el núcleo.
      value:
        cotizacionId: 5d2c8b1a-4e3f-4a6b-9c7d-8e1f2a3b4c5d
        tipo: PRECIO
        registradaEn: '2026-10-13T15:00:00Z'
        regla: VIDA_HIPOTECARIO.TARIFA.v1
        parametros:
          campoBase: montoCredito
          tasaPorMil: '0.35'
          nivel: MEDIO
          factor: '1.00'
          redondeo: AL_PESO_MITAD_ARRIBA
        entradas:
          ramo: VIDA_HIPOTECARIO
          canal: web
          clienteId: 9b1d4e2a-7c3f-4a8b-8e6d-2f1a3b5c7d9e
          socioId: null
          datosBien:
            montoCredito: 200000000
            plazoAnios: 20
            ciudadInmueble: Bogotá
            entidadAcreedora: Banco de Ejemplo
          perfil:
            perfilId: 2a4b6c8d-1e3f-4a5b-8c7d-9e0f1a2b3c4d
            version: 3
            score: 640
            nivel: MEDIO
            senales:
              comportamientoPago: 72
